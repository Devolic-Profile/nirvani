name: osv-scan
# Daily OSV scan of main, so an advisory published after the last PR still fails loudly.
on:
  schedule: [{ cron: '17 14 * * *' }] # daily, 07:17 Pacific
  workflow_dispatch:
permissions: {}
jobs:
  osv:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          image=ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          docker run --rm -v "$PWD":/src:ro "$image" scan source --lockfile /src/package-lock.json
